<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orniflora - Sign In / Register</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-page="auth">

  <nav>
    <a href="auth.html" class="logo">🌿 Orniflora NC-13</a>
    <div class="nav-links">
      <span style="font-size: 0.85rem; opacity: 0.9;">Congressional App Challenge</span>
    </div>
  </nav>

  <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="login-card" style="width: 100%; max-width: 440px; padding: 2rem; margin: auto;">
      
      <!-- Header -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="color: #2d5a27; font-size: 1.6rem; margin-bottom: 0.3rem;">Welcome to Orniflora</h2>
        <p style="color: #666; font-size: 0.9rem;">NC Congressional District 13 Ecological Refuge Network</p>
      </div>

      <!-- Auth Tabs -->
      <div style="display: flex; border-bottom: 2px solid #e0e8e2; margin-bottom: 1.5rem;">
        <button type="button" id="tab-login" onclick="switchAuthTab('login')" style="flex: 1; background: none; color: #2d5a27; border-bottom: 3px solid #2d5a27; border-radius: 0; padding: 0.6rem 0; font-weight: 700;">
          Log In
        </button>
        <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" style="flex: 1; background: none; color: #666; border-bottom: 3px solid transparent; border-radius: 0; padding: 0.6rem 0; font-weight: 600;">
          Sign Up
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div style="margin-bottom: 1.2rem;">
          <label for="login-username" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Username</label>
          <input type="text" id="login-username" placeholder="Enter your handle..." required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.5rem; position: relative;">
          <label for="login-password" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" placeholder="Enter password..." required style="width: 100%; padding: 0.75rem 2.5rem 0.75rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;">
            <span onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem; user-select: none;">👁️</span>
          </div>
        </div>

        <button type="submit" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700;">
          Log In to Dashboard
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" onsubmit="handleSignupSubmit(event)" style="display: none;">
        <div style="margin-bottom: 1.1rem;">
          <label for="signup-username" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Choose Username</label>
          <input type="text" id="signup-username" placeholder="Choose a handle..." required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.1rem;">
          <label for="signup-password" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Create Password</label>
          <div style="position: relative;">
            <input type="password" id="signup-password" placeholder="Create password..." required style="width: 100%; padding: 0.75rem 2.5rem 0.75rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;">
            <span onclick="togglePasswordVisibility('signup-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem; user-select: none;">👁️</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div style="margin-bottom: 1.1rem;">
          <label for="signup-confirm-password" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Confirm Password</label>
          <div style="position: relative;">
            <input type="password" id="signup-confirm-password" placeholder="Re-enter password..." required style="width: 100%; padding: 0.75rem 2.5rem 0.75rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem;">
            <span onclick="togglePasswordVisibility('signup-confirm-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem; user-select: none;">👁️</span>
          </div>
        </div>

        <div style="margin-bottom: 1.1rem;">
          <label for="countySelect" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">NC-13 County Location</label>
          <select id="countySelect" onchange="updateCityOptions()" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; background: white;">
            <option value="Wake">Wake County</option>
            <option value="Johnston">Johnston County</option>
            <option value="Harnett">Harnett County</option>
            <option value="Lee">Lee County</option>
            <option value="Person">Person County</option>
            <option value="Granville">Granville County</option>
            <option value="Franklin">Franklin County</option>
            <option value="Caswell">Caswell County</option>
          </select>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="citySelect" style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #2d5a27;">Town Community</label>
          <select id="citySelect" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; background: white;">
          </select>
        </div>

        <button type="submit" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700;">
          Create Account & Start Conservation
        </button>
      </form>

    </div>
  </div>

  <script>
    const COUNTY_TOWNS = {
      "Wake": ["Holly Springs", "Fuquay-Varina", "Apex", "Cary", "Raleigh"],
      "Johnston": ["Clayton", "Smithfield"],
      "Harnett": ["Lillington"],
      "Lee": ["Sanford"],
      "Person": ["Roxboro"],
      "Granville": ["Oxford"],
      "Franklin": ["Louisburg"],
      "Caswell": ["Yanceyville"]
    };

    function updateCityOptions() {
      const countySelect = document.getElementById("countySelect");
      const citySelect = document.getElementById("citySelect");
      if (!countySelect || !citySelect) return;

      const selectedCounty = countySelect.value || "Wake";
      const towns = COUNTY_TOWNS[selectedCounty] || ["Holly Springs"];

      citySelect.innerHTML = towns.map(town => `<option value="${town}">${town}</option>`).join("");
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");
      const tabLogin = document.getElementById("tab-login");
      const tabSignup = document.getElementById("tab-signup");

      if (tab === "login") {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
        tabLogin.style.borderBottom = "3px solid #2d5a27";
        tabLogin.style.color = "#2d5a27";
        tabLogin.style.fontWeight = "700";
        tabSignup.style.borderBottom = "3px solid transparent";
        tabSignup.style.color = "#666";
        tabSignup.style.fontWeight = "600";
      } else {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        tabSignup.style.borderBottom = "3px solid #2d5a27";
        tabSignup.style.color = "#2d5a27";
        tabSignup.style.fontWeight = "700";
        tabLogin.style.borderBottom = "3px solid transparent";
        tabLogin.style.color = "#666";
        tabLogin.style.fontWeight = "600";
        updateCityOptions();
      }
    }

    function togglePasswordVisibility(inputId, toggleIcon) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        toggleIcon.textContent = "🙈";
      } else {
        input.type = "password";
        toggleIcon.textContent = "👁️";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateCityOptions();
    });
  </script>
</body>
</html>
