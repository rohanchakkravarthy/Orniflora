<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orniflora - Access Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body data-page="auth" style="background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <main class="auth-card-container" style="background: white; border-radius: 16px; width: 100%; max-width: 440px; padding: 2.25rem; box-shadow: 0 12px 32px rgba(27, 67, 50, 0.12); border: 1px solid #d8f3dc;">
    
    <div style="text-align: center; margin-bottom: 1.8rem;">
      <h1 style="color: #1b4332; font-size: 2.1rem; font-weight: 800; margin-bottom: 0.3rem;">Orniflora</h1>
      <p style="color: #40916c; font-weight: 600; font-size: 0.95rem;">Habitat & Biodiversity Tracker</p>
    </div>

    <!-- Auth Toggle Tabs -->
    <div style="display: flex; background: #f0f7f4; padding: 0.3rem; border-radius: 10px; margin-bottom: 1.5rem;">
      <button type="button" id="tab-login-btn" onclick="switchAuthTab('login')" style="flex: 1; padding: 0.65rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; background: white; color: #1b4332; box-shadow: 0 2px 6px rgba(0,0,0,0.06);">
        Log In
      </button>
      <button type="button" id="tab-signup-btn" onclick="switchAuthTab('signup')" style="flex: 1; padding: 0.65rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; background: transparent; color: #52b788;">
        Sign Up
      </button>
    </div>

    <!-- Login Form Section -->
    <form id="login-form" onsubmit="handleLoginSubmit(event)">
      <div style="margin-bottom: 1rem;">
        <label for="login-username" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">Username</label>
        <input type="text" id="login-username" placeholder="Enter your username" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label for="login-password" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit;">
      </div>

      <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s ease;">
        Log In
      </button>
    </form>

    <!-- Sign Up Form Section -->
    <form id="signup-form" onsubmit="handleSignupSubmit(event)" style="display: none;">
      <div style="margin-bottom: 1rem;">
        <label for="signup-username" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">Username</label>
        <input type="text" id="signup-username" placeholder="Choose a unique username" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit;">
      </div>

      <div style="margin-bottom: 1rem;">
        <label for="countySelect" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">County</label>
        <select id="countySelect" onchange="updateCityDropdown()" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit; background: white;">
          <option value="Wake">Wake County</option>
          <option value="Granville">Granville County</option>
          <option value="Johnston">Johnston County</option>
          <option value="Harnett">Harnett County</option>
          <option value="Lee">Lee County</option>
          <option value="Person">Person County</option>
          <option value="Franklin">Franklin County</option>
          <option value="Caswell">Caswell County</option>
        </select>
      </div>

      <div style="margin-bottom: 1rem;">
        <label for="citySelect" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">City</label>
        <select id="citySelect" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit; background: white;">
          <option value="Holly Springs">Holly Springs</option>
          <option value="Raleigh">Raleigh</option>
          <option value="Cary">Cary</option>
          <option value="Apex">Apex</option>
          <option value="Fuquay-Varina">Fuquay-Varina</option>
        </select>
      </div>

      <div style="margin-bottom: 1rem;">
        <label for="signup-password" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">Password</label>
        <input type="password" id="signup-password" placeholder="Create a password" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label for="signup-confirm-password" style="display: block; font-size: 0.85rem; font-weight: 700; color: #2d6a4f; margin-bottom: 0.4rem;">Confirm Password</label>
        <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required style="width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #d8f3dc; border-radius: 8px; font-size: 0.95rem; font-family: inherit;">
      </div>

      <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s ease;">
        Create Account
      </button>
    </form>

  </main>

  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const signupBtn = document.getElementById('tab-signup-btn');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        loginBtn.style.background = 'white';
        loginBtn.style.color = '#1b4332';
        loginBtn.style.boxShadow = '0 2px 6px rgba(0,0,0,0.06)';
        signupBtn.style.background = 'transparent';
        signupBtn.style.color = '#52b788';
        signupBtn.style.boxShadow = 'none';
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        signupBtn.style.background = 'white';
        signupBtn.style.color = '#1b4332';
        signupBtn.style.boxShadow = '0 2px 6px rgba(0,0,0,0.06)';
        loginBtn.style.background = 'transparent';
        loginBtn.style.color = '#52b788';
        loginBtn.style.boxShadow = 'none';
      }
    }

    const CITIES_BY_COUNTY = {
      "Wake": ["Holly Springs", "Raleigh", "Cary", "Apex", "Fuquay-Varina", "Garner", "Knightdale", "Morrisville", "Wake Forest", "Zebulon"],
      "Granville": ["Stovall", "Oxford", "Butner", "Creedmoor"],
      "Johnston": ["Clayton", "Smithfield", "Selma", "Benson"],
      "Harnett": ["Lillington", "Dunn", "Angier"],
      "Lee": ["Sanford", "Broadway"],
      "Person": ["Roxboro"],
      "Franklin": ["Louisburg", "Franklinton", "Bunn"],
      "Caswell": ["Yanceyville", "Milton"]
    };

    function updateCityDropdown() {
      const countySelect = document.getElementById("countySelect");
      const citySelect = document.getElementById("citySelect");
      if (!countySelect || !citySelect) return;

      const selectedCounty = countySelect.value;
      const cities = CITIES_BY_COUNTY[selectedCounty] || ["Holly Springs"];

      citySelect.innerHTML = cities.map(city => `<option value="${city}">${city}</option>`).join("");
    }
  </script>

  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
