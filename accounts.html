<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orniflora - Your Account</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="accounts">

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <h1>Orniflora</h1>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="actions.html">Activities</a>
      <a href="leaderboard.html">Leaderboard</a>
      
      <!-- Profile Menu -->
      <div class="profile-menu-container" style="position: relative; display: inline-block;">
        <button onclick="toggleProfileMenu(event)" class="profile-btn">
          <span id="nav-username">User</span> ▾
        </button>
        <div id="profile-dropdown" class="profile-dropdown">
          <a href="accounts.html" class="active">Your Account</a>
          
          <hr style="border: none; border-top: 1px solid #d8e2dc; margin: 0.3rem 0;">
          
          <button onclick="logoutApp()" class="dropdown-logout-btn">Log Out</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <section class="welcome-banner hero-card">
      <div class="account-header">
        <h2 id="account-username-title" class="account-username-title">Naturalist Account</h2>
        <!-- Subheading text completely removed -->
      </div>
      
      <div class="account-stats-row" style="margin-top: 1.25rem;">
        <div class="stat-box">
          <span class="stat-number" id="account-total-points">0</span>
          <span class="stat-label">Total Points</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="account-streak-days">0</span>
          <span class="stat-label">Day Streak</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="account-tasks-completed">0</span>
          <span class="stat-label">Activities Done</span>
        </div>
      </div>
    </section>

    <!-- Account Details / Settings Section -->
    <section class="activity-section">
      <div class="section-title-group" style="margin-bottom: 1rem;">
        <h3>Account Preferences</h3>
        <p class="section-subtitle">Manage your naturalist profile and assigned county location.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px;">
        <div class="form-group">
          <label>Selected Town & County</label>
          <input type="text" id="account-location-display" value="Holly Springs (Wake County)" readonly style="background-color: #f8fafc; color: var(--text-dark);">
        </div>
        
        <button onclick="logoutApp()" class="btn-primary" style="background-color: #991b1b; margin-top: 0.5rem;">Log Out of Account</button>
      </div>
    </section>

  </main>

  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
