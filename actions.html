<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orniflora - Log Actions</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="tasks">

  <header class="navbar">
    <div class="logo">
      <h1>🌱 Orniflora</h1>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="actions.html" class="active">Log Actions</a>
      <a href="leaderboard.html">Leaderboard</a>
      <div class="profile-menu-container">
        <button onclick="toggleProfileMenu(event)" class="profile-btn">
          👤 <span id="nav-username">User</span> ▾
        </button>
        <div id="profile-dropdown" class="profile-dropdown">
          <a href="accounts.html">Your Account</a>
          <button onclick="logoutApp()" class="dropdown-logout-btn">Log Out</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="welcome-banner">
      <h2>✨ Daily Oasis Tasks</h2>
      <p>Complete action items, upload photo proof, and boost your NC-13 Impact Score.</p>
    </section>

    <section class="activity-section">
      <h3>Available Conservation Activities</h3>
      <div id="tasks-list" class="tasks-container"></div>
    </section>
  </main>

  <!-- Photo Proof Modal -->
  <div id="ai-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3 id="modal-task-title">Activity Proof Upload</h3>
      <p>Upload a photo of your completed conservation activity.</p>
      
      <input type="file" id="photo-input" accept="image/*" onchange="previewUserImage(event)">
      
      <div class="image-preview-container">
        <img id="image-preview" src="" alt="Proof Preview" style="display:none; max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 10px; object-fit: cover;">
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <label for="proof-note">Field Observation Note</label>
        <input type="text" id="proof-note" placeholder="e.g., Refilled birdbath near front porch with clean water">
      </div>

      <div id="ai-status" class="ai-status-text"></div>

      <div class="modal-actions">
        <button id="verify-btn" onclick="submitTaskProof()" class="btn-primary" disabled>Submit & Earn Points</button>
        <button onclick="closeAIModal()" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
