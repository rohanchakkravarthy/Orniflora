<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orniflora - Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body data-page="leaderboard">

  <!-- Navigation bar -->
  <header class="navbar">
    <div class="logo">
      <h1>Orniflora</h1>
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="actions.html">Activities</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>

      <!-- Profile menu -->
      <div class="profile-menu-container" style="position: relative; display: inline-block;">
        <button onclick="toggleProfileMenu(event)" class="profile-btn">
          <span id="nav-username">User</span> ▾
        </button>
        <div id="profile-dropdown" class="profile-dropdown">
          <a href="accounts.html">Your Account</a>
          <hr style="border: none; border-top: 1px solid #e0e8e2; margin: 0.3rem 0;">
          <button onclick="logoutApp()" class="dropdown-logout-btn">Log Out</button>
        </div>
      </div>
    </nav>
  </header>


  <!-- Main container-->
  <main class="container">
    <section class="welcome-banner hero-card">
      <div class="welcome-text">
        <h2>Community Leaderboard</h2>
        <p>See how local naturalists and conservationists across North Carolina rank in habitat points.</p>
      </div>
    </section>

    <!-- Leaderboard card -->
    <section class="stats-card leaderboard-section" style="background: white; border-radius: 12px; padding: 2rem; border: 1px solid #e0e8e2; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
      <div class="section-title-group" style="margin-bottom: 1.5rem;">
        <h3 style="color: #1b4332; margin-bottom: 0.5rem; font-size: 1.35rem; font-weight: 800;">Top Conservationists</h3>
        <p class="click-hint" style="color: #666; font-size: 0.9rem;">Rankings are based on verified daily habitat activities and streak bonuses.</p>
      </div>

      <div id="leaderboard-list" class="leaderboard-grid">
        <!-- Dynamically populated by app.js -->
      </div>
    </section>

  </main>


  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
